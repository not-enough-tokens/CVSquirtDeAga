; PlatformIO Project Configuration File
; Docs: https://docs.platformio.org/page/projectconf.html
;
; Firmware del Arduino. Lo leen igual VS Code, CLion y la línea de comandos (pio).
; Esta carpeta (arduino/) ES el proyecto PlatformIO: abre esta, no una subcarpeta.
;
; Dos entornos:
;   uno  -> el firmware real (src/main.cpp): recibe datos por USB y los muestra en el LCD
;   scan -> herramienta de diagnóstico (src/scan/): lista las direcciones I2C que responden
;   lcdtest -> prueba del LCD con la libreria hd44780 (src/lcd_test/)
;   ledtest -> prueba del enlace USB solo con el LED integrado (src/ledtest/)
; Clon de Uno (ATmega328P). Si fuera un Nano: board = nanoatmega328  (o nanoatmega328new con bootloader nuevo).

[platformio]
default_envs = uno

[env]                       ; opciones comunes a todos los entornos
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
; Si no detecta el puerto de un clon CH340, fíjalo a mano:
; upload_port = COM8
; monitor_port = COM8

[env:uno]
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_src_filter = +<*> -<scan/> -<lcd_test/> -<ledtest/>

[env:scan]
build_src_filter = -<*> +<scan/>

[env:lcdtest]
lib_deps = duinowitchery/hd44780@^1.3.2
build_src_filter = -<*> +<lcd_test/>

[env:ledtest]
build_src_filter = -<*> +<ledtest/>

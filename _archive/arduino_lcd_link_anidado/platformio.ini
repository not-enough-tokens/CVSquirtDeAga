; Proyecto PlatformIO del enlace USB -> LCD. Lo leen igual VS Code, CLion y la línea de comandos (pio).
; Clon de Uno (ATmega328P). Si fuera un Nano: board = nanoatmega328  (o nanoatmega328new con bootloader nuevo).
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
; Si no detecta el puerto de un clon CH340, fíjalo a mano:
; upload_port = COM5
; monitor_port = COM5
